<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script>
        (function () {
            // GitHub Pages（このファイルの配置先）とSharePoint（InfoCall.aspx）はオリジンが異なるため、
            // 相対パスからの逆算はできない。絶対URLを直接指定する。
            var INFOCALL_URL = "https://datawarenet.sharepoint.com/sites/Dev_KoheiY00/InfoshareProductLibrary/Sources/Infoshare.InfoCall/InfoCall.aspx";

            function openInfoCall(event) {
                Office.context.ui.displayDialogAsync(
                    INFOCALL_URL,
                    { height: 50, width: 50 },
                    function (asyncResult) {
                        if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                            // 選択結果をメールへ反映する連携は行わない（閲覧・検索専用)ため、
                            // ここで失敗しても通知手段を持たずコンソールログのみ残す
                            console.error('InfoCall dialog failed to open: ' + asyncResult.error.code + ' ' + asyncResult.error.message);
                        }
                        event.completed();
                    }
                );
            }

            Office.onReady();
            Office.actions.associate('openInfoCall', openInfoCall);
        })();
    </script>
</head>
<body></body>
</html>
